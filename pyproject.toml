[project]
name = "offers"
version = "0.1.0"
description = "Job offer analyzer: RAG, evals and agents over a set of job ads, built with Gemini"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[google,mcp]>=2.67.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "pytest",
    "httpx2>=2.13.1",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages=["offers"]
explicit_package_bases = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
