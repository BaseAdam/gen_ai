[project]
name = "offers"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = ["mypy", "ruff", "pytest"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages=["offers"]
explicit_package_bases = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true