services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: offers
      POSTGRES_PASSWORD: offers
      POSTGRES_DB: offers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://offers:offers@db:5432/offers
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
