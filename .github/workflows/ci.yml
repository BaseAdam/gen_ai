name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: offers
          POSTGRES_PASSWORD: offers
          POSTGRES_DB: offers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests (including the BM25 retrieval gate)
        run: uv run pytest

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -t job-offers-ai .

      - name: Start the API (no database or real key needed for /offers)
        run: >-
          docker run -d --name api -p 8000:8000
          -e GEMINI_API_KEY=dummy -e GEMINI_MODEL=gemini-3.5-flash-lite
          job-offers-ai

      - name: Smoke test (API and frontend)
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8000/offers > /dev/null
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'

      - name: API logs
        if: always()
        run: docker logs api

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Types and build
        run: npm run build